services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: optionwise
      POSTGRES_PASSWORD: optionwise
      POSTGRES_DB: optionwise
    ports:
      - "5432:5432"
    volumes:
      - optionwise-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optionwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  optionwise-db-data:
